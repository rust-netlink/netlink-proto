name: build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  msrv:
    name: Build on minimal supported rust (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features tokio_socket"
          - "--no-default-features --features smol_socket"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        run: |
          rustup override set 1.85
          rustup update 1.85
          rustc --version

      - name: Build with ${{ matrix.features }}
        run: cargo build --all-targets ${{ matrix.features }}
