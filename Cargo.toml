[package]
authors = ["Corentin Henry <corentinhenry@gmail.com>"]
name = "netlink-proto"
version = "0.14.1"
edition = "2024"
rust-version = "1.85"

keywords = ["netlink", "linux", "async"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rust-netlink/netlink-proto"
description = "async netlink protocol"
autoexamples = false

[dependencies]
log = "0.4.8"
futures-channel = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
netlink-packet-core = "0.9.0"
netlink-sys = { default-features = false, version = "0.9.0" }

[features]
default = ["tokio_socket"]
tokio_socket = ["netlink-sys/tokio_socket"]
smol_socket = ["netlink-sys/smol_socket"]

[dev-dependencies]
tokio = { version = "1.0.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
netlink-packet-route = { version = "0.34.0" }
async-std = {version = "1.9.0", features = ["attributes"]}

[[example]]
name = "dump_links"

[[example]]
name = "dump_links_async"
required-features = ["tokio_socket"]

[patch.crates-io]
netlink-packet-core = { git = "https://github.com/cathay4t/netlink-packet-core.git", branch = "main" }
netlink-packet-route = { git = "https://github.com/cathay4t/netlink-packet-route.git", branch = "panic_free" }
